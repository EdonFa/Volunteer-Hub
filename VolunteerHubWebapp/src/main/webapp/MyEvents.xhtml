<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces"
                template="/templates/MainTemplate.xhtml">
    <ui:define name="title">VolunteerHub - My events</ui:define>
    <ui:define name="content">
        <h:form id="myEventsForm">
            <div class="vh-card">
                <div class="vh-section-label">My events</div>
                <p:messages/>

                <p:dataTable value="#{organisationBean.events}" var="e"
                             emptyMessage="You have not posted any event yet.">
                    <p:column headerText="Title">#{e.title}</p:column>
                    <p:column headerText="Category">
                        <p:tag value="#{e.category.title}" styleClass="vh-tag"/>
                    </p:column>
                    <p:column headerText="Dates" style="white-space:nowrap">#{e.startDate} - #{e.endDate}</p:column>
                    <p:column headerText="Status">
                        <span class="vh-status vh-status-#{e.status}">#{e.status}</span>
                    </p:column>
                    <p:column headerText="" style="width:320px; white-space:nowrap">
                        <h:link outcome="Event" value="View" styleClass="vh-btn">
                            <f:param name="id" value="#{e.eventId}"/>
                        </h:link>
                        <h:link outcome="CreateEvent" value="Edit" styleClass="vh-btn vh-btn-outline">
                            <f:param name="id" value="#{e.eventId}"/>
                        </h:link>
                        <p:commandButton value="Close" action="#{organisationBean.close(e)}"
                                         update="myEventsForm" styleClass="ui-button-outlined"
                                         rendered="#{e.status == 'PUBLISHED'}">
                            <p:confirm header="Close recruitment" message="Close recruitment for #{e.title}?"/>
                        </p:commandButton>
                        <p:commandButton value="Delete" action="#{organisationBean.delete(e)}"
                                         update="myEventsForm" styleClass="ui-button-outlined">
                            <p:confirm header="Delete event" message="Delete #{e.title}? This cannot be undone."/>
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
            </div>
        <p:confirmDialog global="true">
            <p:commandButton value="Yes" type="button" styleClass="ui-confirmdialog-yes"/>
            <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-outlined"/>
        </p:confirmDialog>
        </h:form>
    </ui:define>
</ui:composition>
