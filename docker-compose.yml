services:
  # Payara server
  payara:
    container_name: payara-ws
    image: payara/server-full:7.2026.8
    environment:
      SECURE_ADMIN: "true"
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "admin"
    ports:
      - "8080:8080"   # apps
      - "4848:4848"   # admin console
    volumes:
      # auto deploy: maps each local war into Payara's autodeploy folder
      - ./VolunteerHubService/target/VolunteerHubService.war:/opt/payara/appserver/glassfish/domains/domain1/autodeploy/VolunteerHubService.war
      - ./VolunteerHubWebapp/target/VolunteerHubWebapp.war:/opt/payara/appserver/glassfish/domains/domain1/autodeploy/VolunteerHubWebapp.war